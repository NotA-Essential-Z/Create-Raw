org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod info
mod_id=createraw
mod_name=Create: Raw
mod_version=1.0.0
mod_group_id=com.notzessentialz.createraw
mod_author=notzessentialz, Pigiazza
mod_description=A Create addon that reverses smelting recipes using a kinetic block.

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.250
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# Parchment mappings (readable parameter names, matches Create's own build)
parchment_minecraft_version=1.21.1
parchment_version=2024.11.17

# Create dependency
# create_version is the Maven artifact coordinate (includes CurseForge/Modrinth build number).
# create_mod_version is the version Create actually reports at runtime via its own
# mods.toml (no build suffix) - this is what the dependency versionRange must match,
# otherwise NeoForge refuses to load createraw even with the right Create jar installed.
# IMPORTANT: use the latest version actually PUBLISHED on CurseForge/Modrinth, not the
# latest dev build on maven.createmod.net - that maven publishes every CI build, which
# can run ahead of the public release (e.g. 6.0.11-xxx builds existed before any 6.0.11
# was ever published; 6.0.10 was the newest real release at the time of writing).
create_version=6.0.10-281
create_mod_version=6.0.10
create_minecraft_version=1.21.1
